name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Tests (every stage, layout, no public grade, headline matches evidence)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build results regenerate unchanged from the cases
        run: python src/run_build.py && git diff --exit-code results/build.json
      - name: Timed runners run end to end (output to a temp path; timings vary)
        run: |
          python src/run_learn.py "$RUNNER_TEMP/learn.json"
          python src/run_deep.py "$RUNNER_TEMP/deep.json"
          python src/run_probes.py "$RUNNER_TEMP/probes.json"
