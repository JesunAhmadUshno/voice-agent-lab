name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: Learn unit tests
        run: python -m unittest tests.test_learn_voice_agent -v
      - name: Learn runner
        run: python level-1-learn/run_learn.py
      - name: Build unit tests
        run: python -m unittest tests.test_build_voice_agent -v
      - name: Build runner
        run: python level-2-build/run_build.py
