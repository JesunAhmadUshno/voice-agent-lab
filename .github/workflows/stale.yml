name: Stale check (comment only, never closes)
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          stale-issue-message: "This has been quiet for 90 days. It stays open. Flagging it here so it is reviewed, not lost."
          stale-pr-message: "This PR has been quiet for 90 days. It stays open. Flagging it for review."
          days-before-stale: 90
          days-before-close: -1
          exempt-issue-labels: "pinned,keep"
          exempt-pr-labels: "pinned,keep"
